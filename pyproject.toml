[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcm-simulator"
version = "0.1.0"
description = "Offline desktop Body Control Module simulator proof of concept"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "python-can",
    "cantools",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-qt",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
strict = true