name: CI Test and Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on:
      ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint with Ruff
        run: python -m ruff check .
      - name: Check formatting with Ruff
        run: python -m ruff format --check .
      - name: Type check with mypy
        run: python -m mypy src
      - name: Test with pytest
        run: python -m pytest
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcm-simulator-wheel
          path: dist/*.whl
          retention-days: 10
          if-no-files-found: error
